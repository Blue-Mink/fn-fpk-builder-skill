name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FNPACK_VERSION: "1.2.3"
  FNPACK_LINUX_AMD64_SHA256: "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93"
  FNPACK_DARWIN_AMD64_SHA256: "30a9f50a35e8d8d425b687881761478c3c778e9c0da3a1b59f298b666dd7a268"
  FNPACK_DARWIN_ARM64_SHA256: "d40cb00896cb2a5d211357d255750ed0cbe7f2d141df671c2b717afb4e74bf77"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install verified fnpack for integration tests
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}:$(uname -m)" in
            Linux:x86_64)
              target="linux-amd64"
              expected="${FNPACK_LINUX_AMD64_SHA256}"
              ;;
            macOS:x86_64)
              target="darwin-amd64"
              expected="${FNPACK_DARWIN_AMD64_SHA256}"
              ;;
            macOS:arm64)
              target="darwin-arm64"
              expected="${FNPACK_DARWIN_ARM64_SHA256}"
              ;;
            *)
              echo "No verified fnpack binary for ${RUNNER_OS}:$(uname -m)" >&2
              exit 1
              ;;
          esac
          curl --fail --location --silent --show-error \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-${target}" \
            --output "${RUNNER_TEMP}/fnpack"
          python3 - "${RUNNER_TEMP}/fnpack" "${expected}" <<'PY'
          import hashlib
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != sys.argv[2]:
              raise SystemExit(f"fnpack SHA-256 mismatch: {actual}")
          PY
          chmod 755 "${RUNNER_TEMP}/fnpack"
          printf 'FNPACK_BIN=%s\n' "${RUNNER_TEMP}/fnpack" >> "${GITHUB_ENV}"

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tests

      - name: Check CLI surface
        shell: bash
        run: |
          set -euo pipefail
          for command in toolchain init doctor build inspect sources; do
            python3 scripts/fpk.py "${command}" --help | grep -q -- '--json'
          done
          for command in doctor deploy status logs start stop uninstall smoke; do
            python3 scripts/fnos.py "${command}" --help | grep -q -- '--json'
          done

      - name: Run test suite
        shell: bash
        run: python3 -m unittest discover -s tests -v

      - name: Run Skill Creator validation when available
        shell: bash
        run: |
          set -euo pipefail
          validator="${CODEX_SKILL_CREATOR_DIR:-${HOME}/.codex/skills/.system/skill-creator}/scripts/quick_validate.py"
          if [ -f "${validator}" ]; then
            python3 -m pip install \
              --disable-pip-version-check \
              --quiet \
              "PyYAML==6.0.2"
            python3 "${validator}" .
          else
            echo "Skill Creator validator is not installed on this runner; structure is covered by tests."
          fi
